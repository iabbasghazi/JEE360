
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Opening Chapter | JEE Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background:
        radial-gradient(ellipse at top, #172554 0%, transparent 55%),
        #070b14;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 460px;
      padding: 36px 24px;
      text-align: center;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 22px;
      border: 3px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    p {
      color: #94a3b8;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      color: white;
      background: #2563eb;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 650;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader { animation: none; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="loader" aria-hidden="true"></div>
    <h1>Opening your chapter</h1>
    <p id="message">Checking the requested chapter…</p>
    <a id="home" href="./">Go to dashboard</a>
  </main>

  <script>
    (() => {
      const path = window.location.pathname;
      const parts = path.split("/").filter(Boolean);
      const last = parts[parts.length - 1] || "";

      // GitHub Pages project sites use /repository-name/.
      // A missing page inside a project site has the repository name
      // as the first path segment and the chapter slug after it.
      const isProjectSite =
        location.hostname.endsWith("github.io") &&
        parts.length >= 2;

      const chapterSlug = isProjectSite
        ? parts[parts.length - 1]
        : last;

      const basePath = isProjectSite
        ? "/" + parts[0] + "/"
        : "/";

      const message = document.getElementById("message");
      const home = document.getElementById("home");
      home.href = basePath;

      // Do not redirect the 404 page itself or empty paths.
      const reserved = [
        "404.html",
        "index.html",
        "assets",
        "api"
      ];

      if (!chapterSlug || reserved.includes(chapterSlug.toLowerCase())) {
        message.textContent =
          "This page could not be found. Return to your dashboard.";
        document.querySelector(".loader").style.display = "none";
        return;
      }

      // Preserve the requested chapter for index.html to interpret.
      const destination = new URL(basePath, location.origin);
      destination.searchParams.set("chapter", chapterSlug);

      message.textContent = "Redirecting to your requested chapter…";

      window.location.replace(destination.pathname + destination.search);
    })();
  </script>
</body>
</html>
